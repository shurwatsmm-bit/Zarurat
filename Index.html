<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZARORAT - SMM Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#040a08;--line:#1e332b;--text:#eafff5;--muted:#9db5ab;--green:#00e676;--teal:#00c2a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(900px 400px at 20% -10%,rgba(0,230,118,.22),transparent 60%),radial-gradient(800px 400px at 90% 0%,rgba(0,194,168,.18),transparent 60%),var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.font-display{font-family:'Space Grotesk',sans-serif}.wrap{max-width:460px;margin:auto;padding:14px 16px 120px}.wrap-wide{max-width:1180px;margin:auto;padding:14px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center}.logo{display:flex;gap:10px;align-items:center}.z{width:40px;height:40px;border-radius:13px;background:linear-gradient(100deg,#00e676,#00c2a8,#2dd4ff);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:20px;color:#03110a;box-shadow:0 8px 30px rgba(0,230,118,.35)}
.dot{width:10px;height:10px;border-radius:99px;background:#fff;opacity:.14;border:none;cursor:pointer}
.chip{border:1px solid var(--line);background:#0a1511;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.hero{margin-top:26px;text-align:center}.hero h1{font-family:'Space Grotesk';font-size:clamp(38px,11vw,62px);line-height:.95;margin:18px 0 12px}.grad-text{background:linear-gradient(100deg,#00e676,#7dffb8,#2dd4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(14px);border-radius:22px;padding:18px}
.input{width:100%;background:#08110e;border:1px solid var(--line);color:var(--text);border-radius:14px;padding:14px;font-size:15px;outline:none;margin-top:6px}.input:focus{border-color:#00e676;box-shadow:0 0 0 3px rgba(0,230,118,.16)}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{width:100%;background:linear-gradient(100deg,#00e676,#00c2a8,#2dd4ff);color:#03110a;border:none;border-radius:14px;padding:15px;font-weight:800;font-size:15px;cursor:pointer}
.btn2{background:#0e1a14;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#08110e;border:1px solid var(--line);border-radius:12px;padding:4px}.tabs button{border:none;padding:11px;border-radius:9px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted)}.tabs button.on{background:linear-gradient(100deg,#00e676,#00c2a8);color:#03110a}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}.mini{background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px;text-align:center}
.hidden{display:none!important}.sticky{position:sticky;top:0;z-index:20;background:rgba(5,11,9,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin:-14px -16px 0;padding:12px 16px}
.card{background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:16px;margin-top:12px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat>div{background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:16px}
.big{font-family:'Space Grotesk';font-size:28px;font-weight:700}.green{color:var(--green)} .muted{color:var(--muted);font-size:13px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#070f0c;border-top:1px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:30}.navin{max-width:460px;margin:auto;display:grid;grid-template-columns:repeat(7,1fr)}.nav button{background:none;border:none;color:var(--muted);font-size:10px;font-weight:700;display:flex;flex-direction:column;gap:3px;align-items:center;cursor:pointer}.nav button.on{color:var(--green)}
.easypaisa{background:linear-gradient(135deg,#7dffb8,#00e676,#00c2a8);color:#03110a;border-radius:26px;padding:18px;margin-top:14px}.easypaisa .num{font-family:'Space Grotesk';font-size:36px;font-weight:700}
.flex{display:flex;gap:8px}.mt{margin-top:14px} .bar{height:8px;background:#08110e;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#00e676,#2dd4ff)}
.admin-nav{display:flex;gap:8px;overflow:auto;padding-bottom:4px;scrollbar-width:none}.admin-nav button{white-space:nowrap}
.pill{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800}.ok{background:#0f2a1e;color:#7dffb8;border:1px solid #1f4a35}.warn{background:#2a230f;color:#ffd88a;border:1px solid #4a3a1a}.bad{background:#2a1013;color:#ff8a94;border:1px solid #4a1a20}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
</style></head><body><div id="app"></div>
<script>
const KEY="ZARORAT-ADM-2026";
let DB=JSON.parse(localStorage.getItem("zarorat_v2")||"null")||{users:[],services:[],orders:[],deposits:[],tickets:[],notifications:[],coupons:[],announcements:[],categories:[],activity:[],settings:{panelName:"ZARORAT",minDeposit:50,referralBonus:5,supportMessage:"Ask the admin anything. Replies appear inside your ticket."},favorites:[],transactions:[]};
let cur=JSON.parse(localStorage.getItem("zarorat_cur")||"null");
let screen=cur?"user":"auth",tab="home",adminTab="dashboard",authMode="login",catFilter="All",search="",sortBy="featured",tap=0,tapT=null;
function save(){localStorage.setItem("zarorat_v2",JSON.stringify(DB));if(cur)localStorage.setItem("zarorat_cur",JSON.stringify(cur));else localStorage.removeItem("zarorat_cur")}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36)}
function esc(s){return String(s||"").replace(/</g,"&lt;")}
function money(n){return "Rs "+(n||0)}
function log(t){DB.activity.unshift({text:t,createdAt:new Date().toISOString()});save()}
function notify(u2,t,m){DB.notifications.unshift({id:uid(),userId:u2,title:t,message:m,readBy:[],createdAt:new Date().toISOString()});save()}
function level(s){if(s>=20000)return{name:"VIP",next:"Top level reached",p:100};if(s>=5000)return{name:"Gold",next:"Spend Rs 20,000 for VIP",p:s/200};if(s>=1000)return{name:"Silver",next:"Spend Rs 5,000 for Gold",p:s/50};return{name:"New",next:"Spend Rs 1,000 for Silver",p:s/10}}
function myOrders(){return DB.orders.filter(o=>cur&&o.userId===cur.id).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))}
function myDeposits(){return DB.deposits.filter(d=>cur&&d.userId===cur.id)}
function myTickets(){return DB.tickets.filter(t=>cur&&t.userId===cur.id)}
function myNotifs(){return DB.notifications.filter(n=>cur&&(n.userId==="all"||n.userId===cur.id))}
function unread(){return myNotifs().filter(n=>!(n.readBy||[]).includes(cur.id)).length}
function serviceCard(s){let pop=DB.orders.filter(o=>o.serviceId===s.id).length,fav=DB.favorites.some(f=>cur&&f.userId===cur.id&&f.serviceId===s.id);return `<div class="card"><div class="row"><div><span class="chip" style="color:#7dffb8">${esc(s.category)}</span><p style="font-weight:800;margin:10px 0 4px">${esc(s.name)}</p><p class="muted">Min ${s.min} - Max ${s.max} ${pop?` - ${pop} orders`:""}</p><p class="muted">${esc(s.description||"")}</p></div><div style="text-align:right"><b class="green">${money(s.pricePer1000)}<br><span class="muted" style="font-size:11px">/ 1000</span></b><br><button class="btn2" style="margin-top:8px" onclick="toggleFav('${s.id}')">${fav?"★":"☆"}</button></div></div><button class="btn" style="margin-top:12px;padding:11px" onclick="orderService('${s.id}')">Order This Service</button></div>`}
function render(){let app=document.getElementById("app");if(screen==="auth")app.innerHTML=authHTML();else if(screen==="admin")app.innerHTML=adminHTML();else app.innerHTML=userHTML();window.scrollTo(0,0)}
function authHTML(){return `<div class="wrap"><div class="row"><div class="logo"><div class="z">Z</div><div><b class="font-display">${DB.settings.panelName}</b><div class="muted" style="font-size:11px;letter-spacing:.22em">SMM PANEL</div></div></div><button class="dot" onclick="dotTap()"></button></div>
<div id="adminBox" class="hidden glass mt"><p class="label">Admin Access</p><div class="flex" style="margin-top:10px"><input id="admKey" type="password" class="input" style="margin:0" placeholder="Admin key"><button class="btn" style="width:auto;margin-left:8px" onclick="openAdmin()">Open</button></div><p id="admErr" class="muted"></p></div>
<div class="hero"><span class="chip" style="color:#7dffb8">FAST PROCESSING - LIVE SYNC - SECURE DELIVERY</span><p class="muted" style="margin-top:10px"><span style="color:#7dffb8">● Live - Synced</span> - Pro Level Panel</p><h1>Your Need,<br><span class="grad-text">Our Responsibility.</span></h1><p class="muted">A simple, empty, and clean panel. Place your order - <b style="color:#fff">fast & secure processing starts within minutes.</b></p></div>
<div class="glass mt"><div class="tabs"><button class="${authMode==="login"?"on":""}" onclick="setAuth('login')">Login</button><button class="${authMode==="signup"?"on":""}" onclick="setAuth('signup')">Sign Up</button></div>
<div style="margin-top:14px">${authMode==="signup"?`<label class="label">Full Name</label><input id="fName" class="input" placeholder="Your name">`:""}
<label class="label">Email</label><input id="fEmail" class="input" placeholder="e.g. you@example.com">
<label class="label">Password</label><input id="fPass" type="password" class="input" placeholder="••••••••">
${authMode==="signup"?`<label class="label">Referral Code (Optional)</label><input id="fRef" class="input" placeholder="e.g. ZAR-ABC123">`:""}
<p id="authMsg" class="muted"></p><button class="btn" style="margin-top:10px" onclick="doAuth()">${authMode==="login"?"Log In →":"Create Account →"}</button><p style="text-align:center" class="muted">Everything starts empty - Balance <b style="color:#fff">0</b>, Orders <b style="color:#fff">0</b>.</p></div></div>
<div class="grid3"><div class="mini"><b class="font-display" style="font-size:22px">0</b><p class="muted">Fake Services</p></div><div class="mini"><b class="font-display" style="font-size:22px">0</b><p class="muted">Fake Orders</p></div><div class="mini"><b class="font-display" style="font-size:22px">0</b><p class="muted">Fake Balance</p></div></div>
<div class="card" style="border-color:#2a3a1a;background:#141a08"><b>Fast Processing:</b> Orders start within minutes with verified, secure processing.</div>
<p style="text-align:center" class="muted">${DB.settings.panelName} SMM Panel - Empty, clean, and honest from the start.</p></div>`}
function setAuth(m){authMode=m;render()}
function dotTap(){tap++;clearTimeout(tapT);if(tap>=3){tap=0;document.getElementById("adminBox").classList.remove("hidden");return}tapT=setTimeout(()=>tap=0,900)}
function openAdmin(){let v=document.getElementById("admKey").value;if(v.trim()===KEY){screen="admin";adminTab="dashboard";render()}else document.getElementById("admErr").textContent="Admin key is incorrect."}
function doAuth(){let email=document.getElementById("fEmail").value.trim().toLowerCase(),pass=document.getElementById("fPass").value,msg=document.getElementById("authMsg");if(!email.includes("@")){msg.textContent="Enter a valid email address.";return}if(pass.length<4){msg.textContent="Password must be at least 4 characters.";return}let uname=email.split("@")[0];if(authMode==="signup"){let name=document.getElementById("fName").value.trim();if(!name){msg.textContent="Enter your name.";return}if(DB.users.some(u=>u.email===email)){msg.textContent="An account with this email already exists. Please log in instead.";return}let ref=document.getElementById("fRef").value.trim().toUpperCase(),referredBy="";if(ref){let r=DB.users.find(u=>u.referralCode===ref);if(!r){msg.textContent="That referral code is not valid.";return}referredBy=r.id}let code="ZAR-"+uname.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)+uid().slice(0,4).toUpperCase();let u={id:uid(),name,username:uname,email,password:pass,balance:0,status:"Active",referralCode:code,referredBy,createdAt:new Date().toISOString()};DB.users.push(u);cur=u;save();log("New user signed up: @"+uname);screen="user";tab="home";render()}else{let f=DB.users.find(u=>(u.email===email||u.username===email)&&u.password===pass);if(!f){msg.textContent="Email or password is incorrect.";return}if(f.status==="Blocked"){msg.textContent="Your account is blocked. Contact support.";return}cur=f;save();screen="user";tab="home";render()}}
function logout(){cur=null;save();screen="auth";render()}
function orderService(id){tab="new";render();setTimeout(()=>{let el=document.getElementById("selSvc");if(el)el.value=id;calcPrice()},50)}
function toggleFav(id){if(!cur)return;let i=DB.favorites.findIndex(f=>f.userId===cur.id&&f.serviceId===id);if(i>=0)DB.favorites.splice(i,1);else DB.favorites.push({userId:cur.id,serviceId:id,createdAt:new Date().toISOString()});save();render()}
function calcPrice(){let sel=document.getElementById("selSvc"),q=document.getElementById("qty");if(!sel||!q)return;let s=DB.services.find(x=>x.id===sel.value);let box=document.getElementById("priceBox");if(!s||!q.value){box.innerHTML="";return}let est=Math.ceil(Number(q.value)/1000*s.pricePer1000);let coup=document.getElementById("couponIn")?.value.trim().toUpperCase();let disc=0;if(coup){let c=DB.coupons.find(x=>x.code===coup&&x.active);if(c)disc=Math.floor(est*c.discountPercent/100)}box.innerHTML=`<div class="row"><span class="muted">Estimated Price</span><b>${money(est)}</b></div>${disc?`<div class="row"><span class="muted">Coupon Discount</span><b class="green">- ${money(disc)}</b></div>`:""}<div class="row" style="border-top:1px solid var(--line);padding-top:8px"><span>You Pay</span><b class="green">${money(Math.max(0,est-disc))}</b></div>`;box.dataset.final=Math.max(0,est-disc)}
function placeOrder(){let sel=document.getElementById("selSvc"),link=document.getElementById("link").value.trim(),q=Number(document.getElementById("qty").value),msg=document.getElementById("orderMsg");let s=DB.services.find(x=>x.id===sel.value);if(!s){msg.textContent="Please select a service first.";return}if(!link.startsWith("http")){msg.textContent="Enter a valid link - it must start with http / https.";return}if(!q||q<s.min||q>s.max){msg.textContent=`Quantity must be between ${s.min} and ${s.max}.`;return}calcPrice();let final=Number(document.getElementById("priceBox").dataset.final||0);if(cur.balance<final){msg.textContent=`Balance is low. You need ${money(final)}, and your balance is ${money(cur.balance)}.`;return}let coup=document.getElementById("couponIn").value.trim().toUpperCase();let c=DB.coupons.find(x=>x.code===coup&&x.active);DB.orders.unshift({id:uid(),userId:cur.id,username:cur.username,serviceId:s.id,serviceName:s.name,link,quantity:q,price:final,status:"Pending",couponCode:c?c.code:"",createdAt:new Date().toISOString()});cur.balance-=final;save();log(`User @${cur.username} placed order: ${s.name} (Qty ${q}, ${money(final)})`);if(cur.referredBy){let r=DB.users.find(u=>u.id===cur.referredBy);if(r){let bonus=Math.floor(final*DB.settings.referralBonus/100);if(bonus>0){r.balance+=bonus;DB.transactions.unshift({id:uid(),userId:r.id,username:r.username,type:"Referral Bonus",title:`Referral bonus from @${cur.username}`,amount:bonus,status:"Paid",createdAt:new Date().toISOString()});notify(r.id,"Referral Bonus Earned",`You earned ${money(bonus)} referral bonus from @${cur.username}.`)}}}save();tab="orders";render()}
function submitDeposit(){let amt=Number(document.getElementById("depAmt").value),tid=document.getElementById("depTid").value.trim(),note=document.getElementById("depNote").value.trim(),msg=document.getElementById("depMsg");if(!amt||amt<=0){msg.textContent="Enter a valid amount greater than 0.";return}if(amt<DB.settings.minDeposit){msg.textContent=`Minimum deposit is ${money(DB.settings.minDeposit)}.`;return}if(!tid){msg.textContent="Enter your Transaction ID (TID).";return}DB.deposits.unshift({id:uid(),userId:cur.id,username:cur.username,amount:amt,tid,note,status:"Pending",createdAt:new Date().toISOString()});save();log(`User @${cur.username} requested deposit: ${money(amt)} (TID ${tid})`);msg.textContent="Deposit request submitted! Status: Pending. Admin will approve it.";document.getElementById("depAmt").value="";document.getElementById("depTid").value=""}
function createTicket(){let sub=document.getElementById("tSub").value.trim(),m=document.getElementById("tMsg").value.trim(),msg=document.getElementById("ticketMsg");if(!sub||!m){msg.textContent="Enter a subject and a message.";return}DB.tickets.unshift({id:uid(),userId:cur.id,username:cur.username,email:cur.email,subject:sub,message:m,status:"Open",replies:[],createdAt:new Date().toISOString()});save();log(`User @${cur.username} opened ticket: ${sub}`);msg.textContent="Ticket created. Admin will reply here.";document.getElementById("tSub").value="";document.getElementById("tMsg").value="";render()}
function replyTicket(id){let v=document.getElementById("reply-"+id).value.trim();if(!v)return;let t=DB.tickets.find(x=>x.id===id);t.replies.push({sender:"user",text:v,at:new Date().toISOString()});t.status="Open";save();render()}
function markRead(id){let n=DB.notifications.find(x=>x.id===id);if(n&&!n.readBy.includes(cur.id))n.readBy.push(cur.id);save();render()}
function markAllRead(){myNotifs().forEach(n=>{if(!n.readBy.includes(cur.id))n.readBy.push(cur.id)});save();render()}
function copyText(t,el){if(navigator.clipboard)navigator.clipboard.writeText(t);if(el)el.textContent="Copied!";setTimeout(()=>render(),1200)}
function goTab(t){tab=t;render()}
function setCat(c){catFilter=c;render()}
function reorder(id){let o=DB.orders.find(x=>x.id===id);if(!o)return;tab="new";render();setTimeout(()=>{let el=document.getElementById("selSvc");if(el)el.value=o.serviceId;let l=document.getElementById("link");if(l)l.value=o.link;let q=document.getElementById("qty");if(q)q.value=o.quantity;calcPrice()},50)}
function userHTML(){
let spent=myOrders().filter(o=>o.status!=="Cancelled"&&o.status!=="Refunded").reduce((s,o)=>s+o.price,0);
let comp=myOrders().filter(o=>o.status==="Completed").length,pend=myOrders().filter(o=>o.status==="Pending").length;
let lvl=level(spent),refs=DB.users.filter(u=>u.referredBy===cur.id),refEarn=DB.transactions.filter(t=>t.userId===cur.id&&t.type==="Referral Bonus").reduce((s,t)=>s+t.amount,0);
let ann=DB.announcements.filter(a=>a.enabled);
let visible=DB.services.filter(s=>(catFilter==="All"||s.category===catFilter)&&s.name.toLowerCase().includes(search.toLowerCase()));
if(sortBy==="low")visible=[...visible].sort((a,b)=>a.pricePer1000-b.pricePer1000);if(sortBy==="high")visible=[...visible].sort((a,b)=>b.pricePer1000-a.pricePer1000);
let cats=["All",...new Set([...(DB.categories.map(c=>c.name)),...DB.services.map(s=>s.category),"Instagram","TikTok","YouTube","Facebook","Design","Website","Other"])];
let favIds=new Set(DB.favorites.filter(f=>f.userId===cur.id).map(f=>f.serviceId));
let wallet=[];myDeposits().forEach(d=>wallet.push({date:d.createdAt,title:"Deposit - Easypaisa",detail:"TID "+d.tid,amount:d.amount,status:d.status}));myOrders().forEach(o=>wallet.push({date:o.createdAt,title:"Order - "+o.serviceName,detail:"Qty "+o.quantity,amount:-o.price,status:o.status}));DB.transactions.filter(t=>t.userId===cur.id).forEach(t=>wallet.push({date:t.createdAt,title:t.title,detail:t.type,amount:t.amount,status:t.status}));wallet.sort((a,b)=>b.date.localeCompare(a.date));
let header=`<div class="wrap"><div class="sticky"><div class="row"><div class="logo"><div class="z">Z</div><div><b class="font-display">${DB.settings.panelName} <span class="green">PANEL</span></b><div class="muted">Hello, ${esc(cur.name)} - <span style="color:#7dffb8">● Live - Synced</span></div></div></div><div class="flex"><button class="btn2" onclick="goTab('notifications')">🔔 ${unread()?`<b style="color:#ff5d6c">${unread()}</b>`:""}</button><button class="btn2" onclick="logout()">Logout</button></div></div></div>`;
let body="";
if(tab==="home"){
body+=ann.map(a=>`<div class="card" style="border-color:#2a3a1a;background:#141a08"><b>📢 ${esc(a.title)}</b><p>${esc(a.message)}</p></div>`).join("");
body+=`<div style="background:linear-gradient(100deg,#00e676,#00c2a8,#2dd4ff);color:#03110a;border-radius:24px;padding:20px;margin-top:14px"><p style="font-size:11px;font-weight:800;letter-spacing:.18em">FAST PROCESSING - SECURE APPROVAL</p><h2 class="font-display" style="font-size:28px;line-height:1.05;margin:8px 0">Place your order,<br>processing starts fast.</h2><button class="btn" style="background:#03110a;color:#fff;width:auto;padding:11px 18px" onclick="goTab('new')">New Order →</button></div>`;
body+=`<div class="row mt"><h3 class="font-display">📊 My Analytics</h3><span class="chip">👑 ${lvl.name}</span></div><div class="stat mt"><div><p class="muted">MY BALANCE</p><p class="big">${money(cur.balance)}</p><a href="#" onclick="goTab('wallet');return false" class="green" style="font-size:12px;font-weight:700">View Wallet History →</a></div><div><p class="muted">TOTAL ORDERS</p><p class="big">${myOrders().length}</p></div><div><p class="muted">TOTAL SPENT</p><p class="big">${money(spent)}</p><p class="muted">${lvl.next}</p></div><div><p class="muted">COMPLETED</p><p class="big">${comp}</p><p style="color:#ffd88a;font-size:12px">${pend} pending</p></div></div>`;
body+=`<div class="flex mt"><button class="btn2" style="flex:1" onclick="goTab('favorites')">⭐ Favorites<br><span class="muted">${DB.services.filter(s=>favIds.has(s.id)).length} saved</span></button><button class="btn2" style="flex:1" onclick="goTab('profile')">🎁 Referrals<br><span class="muted">${refs.length} - ${money(refEarn)} earned</span></button></div>`;

if(adminTab==="deposits"){b+=`<h3>Deposit Requests</h3><p class="muted">Check Easypaisa payment first. Approve adds amount to balance.</p>${DB.deposits.length?DB.deposits.map(d=>`<div class="card"><div class="row"><div><b class="font-display" style="font-size:24px">${money(d.amount)}</b><p>@${esc(d.username)} - ${new Date(d.createdAt).toLocaleString()}</p><p>TID: <b>${esc(d.tid)}</b></p><p class="muted">${esc(d.note||"")}</p></div><span class="pill ${d.status==="Approved"?"ok":d.status==="Rejected"?"bad":"warn"}">${d.status}</span></div>${d.status==="Pending"?`<div class="flex mt"><button class="btn" style="width:auto" onclick="approveDep('${d.id}')">Approve & Add Balance</button><button class="btn2" onclick="rejectDep('${d.id}')">Reject</button></div>`:""}</div>`).join(""):`<div class="card" style="text-align:center">No deposit requests yet</div>`}`}
if(adminTab==="users"){b+=`<div style="display:grid;grid-template-columns:380px 1fr;gap:16px"><div class="card"><h3>Edit Balance</h3><label class="label">Select User</label><select id="balUser" class="input">${DB.users.map(u=>`<option value="${u.id}">${esc(u.name)} (@${esc(u.username)}) — ${money(u.balance)}</option>`).join("")}</select><label class="label">Amount (Rs)</label><input id="balAmt" type="number" class="input" placeholder="e.g. 500"><div class="flex mt"><button class="btn" onclick="addBal('add')">Add Balance</button><button class="btn2" onclick="addBal('remove')">Remove</button></div></div><div><h3>Users (${DB.users.length})</h3>${DB.users.map(u=>`<div class="card"><div class="row"><div><b>${esc(u.name)}</b><p class="muted">@${esc(u.username)} - ${esc(u.email||"")} - Referral: ${u.referralCode}</p><p class="muted">Joined ${new Date(u.createdAt).toLocaleDateString()} - ${DB.orders.filter(o=>o.userId===u.id).length} orders</p></div><div style="text-align:right"><b>${money(u.balance)}</b><br><span class="pill ${u.status==="Blocked"?"bad":"ok"}">${u.status||"Active"}</span></div></div><div class="flex mt"><button class="btn2" onclick="toggleBlock('${u.id}')">${u.status==="Blocked"?"Unblock":"Block"} User</button><button class="btn2" style="color:#ff8a94" onclick="delUser('${u.id}')">Delete User</button></div></div>`).join("")||"<p class='muted'>No users yet</p>"}</div></div>`}
if(adminTab==="tickets"){b+=`<h3>Support Tickets (${DB.tickets.length})</h3>${DB.tickets.map(t=>`<div class="card"><div class="row"><div><b>${esc(t.subject)}</b><p class="muted">@${esc(t.username)} - ${esc(t.email)} - ${new Date(t.createdAt).toLocaleString()}</p><p>${esc(t.message)}</p></div><span class="pill warn">${t.status}</span></div>${(t.replies||[]).map(r=>`<div class="card" style="background:#08110e"><b>${r.sender==="admin"?"ADMIN":"@"+esc(t.username)}</b><p>${esc(r.text)}</p></div>`).join("")}<div class="flex mt"><input id="areply-${t.id}" class="input" style="margin:0" placeholder="Write your reply..."><button class="btn2" onclick="adminReply('${t.id}')">Send</button><button class="btn2" onclick="closeTicket('${t.id}')">Close</button></div></div>`).join("")||"<div class='card'>No tickets here</div>"}`}
if(adminTab==="notifications"){b+=`<div style="display:grid;grid-template-columns:380px 1fr;gap:16px"><div class="card"><h3>Send Notification</h3><label class="label">Send To</label><select id="nTarget" class="input"><option value="all">All Users</option>${DB.users.map(u=>`<option value="${u.id}">${esc(u.name)} (@${esc(u.username)})</option>`).join("")}</select><label class="label">Title</label><input id="nTitle" class="input" placeholder="e.g. New Service Added"><label class="label">Message</label><textarea id="nMsg" class="input" rows="4"></textarea><button class="btn" style="margin-top:10px" onclick="sendNotif()">Send Notification</button></div><div><h3>Sent Notifications (${DB.notifications.length})</h3>${DB.notifications.map(n=>`<div class="card"><b>${esc(n.title)}</b><p class="muted">${esc(n.message)}</p><p class="muted">${new Date(n.createdAt).toLocaleString()} - Read by ${(n.readBy||[]).length}</p></div>`).join("")||"<p class='muted'>No notifications yet</p>"}</div></div>`}
if(adminTab==="coupons"){b+=`<div class="card"><h3>Create Coupon</h3><label class="label">Coupon Code</label><input id="cCode" class="input" placeholder="e.g. SAVE10"><label class="label">Discount %</label><input id="cDisc" type="number" class="input" value="10"><button class="btn" style="margin-top:10px" onclick="addCoupon()">Create Coupon</button></div>${DB.coupons.map(c=>`<div class="card"><div class="row"><div><b>${c.code}</b><p class="muted">${c.discountPercent}% off</p></div><div class="flex"><button class="btn2" onclick="toggleCoupon('${c.id}')">${c.active?"Disable":"Enable"}</button><button class="btn2" onclick="delCoupon('${c.id}')">Delete</button></div></div></div>`).join("")}`}
if(adminTab==="announcements"){b+=`<div class="card"><h3>Create Announcement</h3><label class="label">Title</label><input id="aTitle" class="input"><label class="label">Message</label><textarea id="aMsg" class="input" rows="3"></textarea><button class="btn" style="margin-top:10px" onclick="addAnn()">Create Announcement</button></div>${DB.announcements.map(a=>`<div class="card"><div class="row"><div><b>${esc(a.title)}</b><p class="muted">${esc(a.message)}</p></div><div class="flex"><button class="btn2" onclick="toggleAnn('${a.id}')">${a.enabled?"Disable":"Enable"}</button><button class="btn2" onclick="delAnn('${a.id}')">Delete</button></div></div></div>`).join("")}`}
if(adminTab==="activity"){b+=`<h3>Activity Log</h3>${DB.activity.slice(0,50).map(a=>`<div class="card"><div class="row"><p>${esc(a.text)}</p><span class="muted">${new Date(a.createdAt).toLocaleString()}</span></div></div>`).join("")||"<p class='muted'>No activity yet</p>"}`}
if(adminTab==="settings"){b+=`<div class="card" style="max-width:640px"><h3>Panel Settings</h3><label class="label">Panel Name</label><input id="setName" class="input" value="${esc(DB.settings.panelName)}"><label class="label">Minimum Deposit (Rs)</label><input id="setMin" type="number" class="input" value="${DB.settings.minDeposit}"><label class="label">Referral Bonus (%)</label><input id="setBonus" type="number" class="input" value="${DB.settings.referralBonus}"><label class="label">Support Message</label><textarea id="setSup" class="input" rows="3">${esc(DB.settings.supportMessage)}</textarea><button class="btn" style="margin-top:10px" onclick="saveSettings()">Save Settings</button></div>`}
return h+b+`</div>`;
}
function addService(){let n=document.getElementById("sName").value.trim(),p=Number(document.getElementById("sPrice").value),mn=Number(document.getElementById("sMin").value),mx=Number(document.getElementById("sMax").value),cat=document.getElementById("sCat").value,d=document.getElementById("sDesc").value.trim();if(!n||!p){alert("Service name, price required");return}DB.services.unshift({id:uid(),name:n,category:cat,pricePer1000:p,min:mn,max:mx,description:d,createdAt:new Date().toISOString()});save();log(`Admin added service: ${n} (${cat})`);render()}
function delService(id){DB.services=DB.services.filter(s=>s.id!==id);save();render()}
function addCat(){let n=document.getElementById("catName").value.trim();if(!n)return;DB.categories.unshift({id:uid(),name:n,createdAt:new Date().toISOString()});save();render()}
function delCat(id){DB.categories=DB.categories.filter(c=>c.id!==id);save();render()}
function setOrder(id,st){let o=DB.orders.find(x=>x.id===id);o.status=st;save();notify(o.userId,`Order ${st}`,`Your order "${o.serviceName}" (Qty ${o.quantity}) is now ${st}.`);log(`Admin marked order as ${st}: ${o.serviceName} for @${o.username}`);render()}
function refundOrder(id){let o=DB.orders.find(x=>x.id===id);let u=DB.users.find(x=>x.id===o.userId);if(!u)return;u.balance+=o.price;o.status="Refunded";save();notify(o.userId,"Order Refunded",`Your order "${o.serviceName}" was refunded. ${money(o.price)} has been returned.`);render()}
function approveDep(id){let d=DB.deposits.find(x=>x.id===id);let u=DB.users.find(x=>x.id===d.userId);if(!u)return;u.balance+=d.amount;d.status="Approved";save();notify(d.userId,"Deposit Approved",`Your deposit of ${money(d.amount)} was approved.`);log(`Admin approved deposit: ${money(d.amount)} for @${u.username}`);render()}
function rejectDep(id){let d=DB.deposits.find(x=>x.id===id);d.status="Rejected";save();notify(d.userId,"Deposit Rejected",`Your deposit of ${money(d.amount)} was rejected.`);render()}
function addBal(mode){let uid2=document.getElementById("balUser").value,amt=Number(document.getElementById("balAmt").value);let u=DB.users.find(x=>x.id===uid2);if(!u||!amt)return;if(mode==="add"){u.balance+=amt;DB.transactions.unshift({id:uid(),userId:u.id,username:u.username,type:"Balance Adjustment",title:"Balance added by admin",amount:amt,status:"Completed",createdAt:new Date().toISOString()});notify(u.id,"Balance Added",`${money(amt)} was added to your balance by admin.`)}else{u.balance=Math.max(0,u.balance-amt);DB.transactions.unshift({id:uid(),userId:u.id,username:u.username,type:"Balance Adjustment",title:"Balance removed by admin",amount:-amt,status:"Completed",createdAt:new Date().toISOString()});notify(u.id,"Balance Removed",`${money(amt)} was removed from your balance by admin.`)}save();render()}
function toggleBlock(id){let u=DB.users.find(x=>x.id===id);u.status=u.status==="Blocked"?"Active":"Blocked";save();render()}
function delUser(id){if(!confirm("Delete this user?"))return;DB.users=DB.users.filter(u=>u.id!==id);save();render()}
function adminReply(id){let v=document.getElementById("areply-"+id).value.trim();if(!v)return;let t=DB.tickets.find(x=>x.id===id);t.replies.push({sender:"admin",text:v,at:new Date().toISOString()});t.status="Replied";save();notify(t.userId,"Ticket Reply",`Admin replied to your ticket "${t.subject}".`);render()}
function closeTicket(id){let t=DB.tickets.find(x=>x.id===id);t.status="Closed";save();render()}
function sendNotif(){let target=document.getElementById("nTarget").value,title=document.getElementById("nTitle").value.trim(),msg=document.getElementById("nMsg").value.trim();if(!title||!msg)return;notify(target,title,msg);render()}
function addCoupon(){let code=document.getElementById("cCode").value.trim().toUpperCase(),disc=Number(document.getElementById("cDisc").value);if(!code||!disc)return;DB.coupons.unshift({id:uid(),code,discountPercent:disc,expiry:"",active:true,createdAt:new Date().toISOString()});save();render()}
function toggleCoupon(id){let c=DB.coupons.find(x=>x.id===id);c.active=!c.active;save();render()}
function delCoupon(id){DB.coupons=DB.coupons.filter(c=>c.id!==id);save();render()}
function addAnn(){let t=document.getElementById("aTitle").value.trim(),m=document.getElementById("aMsg").value.trim();if(!t||!m)return;DB.announcements.unshift({id:uid(),title:t,message:m,enabled:true,createdAt:new Date().toISOString()});save();render()}
function toggleAnn(id){let a=DB.announcements.find(x=>x.id===id);a.enabled=!a.enabled;save();render()}
function delAnn(id){DB.announcements=DB.announcements.filter(a=>a.id!==id);save();render()}
function saveSettings(){DB.settings={panelName:document.getElementById("setName").value.trim()||"ZARORAT",minDeposit:Number(document.getElementById("setMin").value)||50,referralBonus:Number(document.getElementById("setBonus").value)||5,supportMessage:document.getElementById("setSup").value.trim()};save();render()}
render();
</script></body></html>
