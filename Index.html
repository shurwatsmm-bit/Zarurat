<script>

// ===== REALTIME DATABASE - ZARORA - FIXED VERSION =====
const DB_URL = "https://zarora-f7526-default-rtdb.firebaseio.com/zarorat.json";
const FIREBASE_CONFIG = { apiKey:"PASTE_YOUR_API_KEY_HERE_IF_NEEDED", authDomain:"zarora-f7526.firebaseapp.com", databaseURL:"https://zarora-f7526-default-rtdb.firebaseio.com", projectId:"zarora-f7526" };
let DB=null, _saving=false, _lastJSON="", _syncTimer=null, DB_STATUS="checking...", DB_ERROR="";
const EMPTY_DB = ()=>({users:[],services:[],orders:[],deposits:[],tickets:[],notifications:[],coupons:[],announcements:[],categories:[],activity:[],settings:{panelName:"ZARORAT",minDeposit:50,referralBonus:5,supportMessage:"Ask the support team anything. Replies appear inside your ticket."},favorites:[],transactions:[]});
function setDBStatus(s, err){ DB_STATUS=s; DB_ERROR=err||""; let el=document.getElementById("dbStatusBox"); if(el){ el.innerHTML = s==="connected" ? "<span style='color:#00e676;font-weight:800'>● DATABASE CONNECTED • REAL-TIME ON</span> <span class='muted'>• "+(DB_ERROR||"")+"</span>" : "<span style='color:#ff8a94;font-weight:800'>● DATABASE NOT CONNECTED: "+err+"</span><br><span class='muted'>Firebase Console → Realtime Database → Rules me neeche wala rule lagao, phir page refresh karo.</span><br><code style='background:#08110e;padding:8px 10px;border-radius:10px;display:block;margin-top:8px;color:#7dffb8'>{ \"rules\": { \".read\": true, \".write\": true } }</code><br><button class='btn2' onclick='testConnection()'>🔄 Test Connection Again</button>"; el.style.display="block"; } updateSyncBadge(); }
async function testConnection(){
  setDBStatus("checking...", "Testing...");
  try{
    let r = await fetch(DB_URL+"?t="+Date.now());
    if(!r.ok){ setDBStatus("blocked", "Firebase ne request rok di. Status: "+r.status+" - Rules me .read/.write true karo."); return false; }
    let j = await r.json();
    setDBStatus("connected", "GET OK • "+new Date().toLocaleTimeString());
    return true;
  }catch(e){ setDBStatus("blocked", "Network / CORS Error: "+e.message+" - Internet check karo aur Rules true karo."); return false; }
}
async function loadDB(){
  try{
    let r=await fetch(DB_URL+"?t="+Date.now());
    if(!r.ok){ DB=JSON.parse(localStorage.getItem("zarorat_backup")||"null")||EMPTY_DB(); setDBStatus("blocked","GET failed Status "+r.status+" - Rules me .read true karo."); return DB; }
    let j=await r.json(); DB=j||EMPTY_DB(); for(const k in EMPTY_DB()) if(!DB[k]) DB[k]=EMPTY_DB()[k];
    setDBStatus("connected","Loaded from Firebase • "+new Date().toLocaleTimeString());
  }catch(e){ DB=JSON.parse(localStorage.getItem("zarorat_backup")||"null")||EMPTY_DB(); setDBStatus("blocked","Network Error: "+e.message); }
  _lastJSON=JSON.stringify(DB); return DB;
}
async function saveDB(){
  localStorage.setItem("zarorat_backup",JSON.stringify(DB));
  // Same-browser instant sync - doosri tab turant update hogi, Firebase fail bhi ho to bhi
  try{ let bc=new BroadcastChannel("zarorat-sync"); bc.postMessage({type:"db", db:DB}); bc.close(); }catch(e){}
  try{ localStorage.setItem("zarorat_broadcast", JSON.stringify({t:Date.now(), db:DB})); }catch(e){}
  let j=JSON.stringify(DB); if(j===_lastJSON) return; _lastJSON=j; _saving=true;
  try{
    let r=await fetch(DB_URL,{method:"PUT",headers:{"Content-Type":"application/json"},body:j});
    if(!r.ok){ setDBStatus("blocked","PUT failed Status "+r.status+" - Rules me .write true karo. Local me save ho gaya hai."); }
    else setDBStatus("connected","Saved to Firebase • "+new Date().toLocaleTimeString());
  }catch(e){ setDBStatus("blocked","Save Network Error: "+e.message); }
  _saving=false; showSync();
}
function showSync(){ let el=document.getElementById("syncBadge"); if(!el){ el=document.createElement("div"); el.id="syncBadge"; el.className="sync"; el.innerHTML="<span class='live'></span> &nbsp;Synced • Real-time"; document.body.appendChild(el);} el.style.display="block"; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display="none",1800); }
function toast(msg){ let t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36); }
function esc(s){ return String(s||"").replace(/</g,"&lt;"); }
function money(n){ return "Rs "+(n||0); }

// Same-browser live sync - BroadcastChannel + storage event
try{ let bc2=new BroadcastChannel("zarorat-sync"); bc2.onmessage=(e)=>{ if(e.data && e.data.db){ let nj=JSON.stringify(e.data.db); if(nj!==_lastJSON){ DB=e.data.db; _lastJSON=nj;

let _origRender = render; render = function(){ _origRender(); ensureDBBox(); setDBStatus(DB_STATUS, DB_ERROR); };

onRemoteChange&&onRemoteChange(); } } }; }catch(e){}
window.addEventListener("storage",(e)=>{ if(e.key==="zarorat_broadcast" && e.newValue){ try{ let d=JSON.parse(e.newValue); let nj=JSON.stringify(d.db); if(nj!==_lastJSON){ DB=d.db; _lastJSON=nj; onRemoteChange&&onRemoteChange(); } }catch(err){} } });

// ===== FIXED ULTRA-FAST SYNC + BUTTON FIX =====
let _lastInteraction = 0, _renderQueued = false, _sse = null, _lastSyncMs = 0;
document.addEventListener('pointerdown', ()=>{ _lastInteraction = Date.now(); }, true);
document.addEventListener('input', ()=>{ _lastInteraction = Date.now(); }, true);
function isTyping(){ let a=document.activeElement; return a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'); }
function safeRender(force){
  // Agar user type kar raha hai ya abhi-abhi click kiya hai to render rok do - warna button/input toot jata hai
  if(!force && (isTyping() || Date.now()-_lastInteraction < 600)){ _renderQueued=true; setTimeout(()=>{ if(_renderQueued){ _renderQueued=false; safeRender(true); } }, 900); return; }
  // Input values save karo taake render ke baad wapas aa jayein
  let saved={}; document.querySelectorAll('input,textarea,select').forEach(el=>{ if(el.id) saved[el.id]=el.value; });
  try{ render(); }catch(e){ console.log(e); }
  Object.keys(saved).forEach(id=>{ let el=document.getElementById(id); if(el && document.activeElement!==el) el.value=saved[id]; });
}
function startUltraSync(){
  // 1) Firebase Realtime SSE stream - sab se fast, server push karta hai
  try{
    if(_sse) _sse.close();
    _sse = new EventSource(DB_URL);
    _sse.onmessage = (ev)=>{
      try{
        let parsed = JSON.parse(ev.data);
        if(parsed && parsed.data && typeof parsed.data==='object'){
          let nj = JSON.stringify(parsed.data);
          if(nj!==_lastJSON){ DB=parsed.data; _lastJSON=nj; localStorage.setItem("zarorat_backup",nj); _lastSyncMs=Date.now(); updateSyncBadge(); onRemoteChange&&onRemoteChange(); }
        }
      }catch(e){}
    };
    _sse.onerror = ()=>{ /* fallback polling sambhal lega */ };
  }catch(e){}
  // 2) Fast polling fallback - har 800ms, sirf tab jab SSE se update na aaya ho
  clearInterval(_syncTimer);
  _syncTimer = setInterval(async()=>{
    if(_saving) return;
    try{
      let t0=performance.now();
      let r=await fetch(DB_URL+"?t="+Date.now());
      let j=await r.json(); if(!j) return;
      let nj=JSON.stringify(j);
      if(nj!==_lastJSON){ DB=j; _lastJSON=nj; localStorage.setItem("zarorat_backup",nj); _lastSyncMs=Date.now(); updateSyncBadge(); onRemoteChange&&onRemoteChange(); }
      let ms=Math.round(performance.now()-t0); let el=document.getElementById("syncMs"); if(el) el.textContent=ms+"ms";
    }catch(e){}
  }, 800);
}
function updateSyncBadge(){
  let el=document.getElementById("syncBadge");
  if(!el){ el=document.createElement("div"); el.id="syncBadge"; el.className="sync"; document.body.appendChild(el); }
  el.innerHTML="<span class='live'></span> &nbsp;Live Sync • <span id='syncMs'>0ms</span> • Real-time";
  el.style.display="block";
  clearTimeout(el._t); el._t=setTimeout(()=>{ el.style.display="block"; }, 10000);
}
// Purani polling ko ultra sync se replace karo
startPolling = startUltraSync;

async function doAuth(){ let email=document.getElementById("fEmail").value.trim().toLowerCase(), pass=document.getElementById("fPass").value, msg=document.getElementById("authMsg"); if(!email.includes("@")){msg.textContent="Enter a valid email address.";return} if(pass.length<4){msg.textContent="Password must be at least 4 characters.";return} let uname=email.split("@")[0];
 if(authMode==="signup"){ let name=document.getElementById("fName").value.trim(); if(!name){msg.textContent="Enter your name.";return} if(DB.users.some(u=>u.email===email)){msg.textContent="An account with this email already exists. Please log in instead.";return} let ref=document.getElementById("fRef").value.trim().toUpperCase(), referredBy=""; if(ref){ let r=DB.users.find(u=>u.referralCode===ref); if(!r){msg.textContent="That referral code is not valid.";return} referredBy=r.id; } let code="ZAR-"+uname.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)+uid().slice(0,4).toUpperCase(); let u={id:uid(),name,username:uname,email,password:pass,balance:0,status:"Active",referralCode:code,referredBy,createdAt:new Date().toISOString()}; DB.users.push(u); cur=u; await save(); await log("New user signed up: @"+uname); confetti(); screen="user"; tab="home"; render(); }
 else{ let f=DB.users.find(u=>(u.email===email||u.username===email)&&u.password===pass); if(!f){msg.textContent="Email or password is incorrect.";return} if(f.status==="Blocked"){msg.textContent="Your account is blocked. Contact support.";return} cur=f; await save(); screen="user"; tab="home"; render(); } }

function calcPrice(){ let sel=document.getElementById("selSvc"), q=document.getElementById("qty"); if(!sel||!q) return; let s=DB.services.find(x=>x.id===sel.value); let box=document.getElementById("priceBox"); if(!s||!q.value){box.innerHTML="";return} let est=Math.ceil(Number(q.value)/1000*s.pricePer1000); let coup=document.getElementById("couponIn")?.value.trim().toUpperCase(); let disc=0; if(coup){ let c=DB.coupons.find(x=>x.code===coup&&x.active); if(c) disc=Math.floor(est*c.discountPercent/100); } box.innerHTML=`<div class="row"><span class="muted">Estimated Price</span><b>${money(est)}</b></div>${disc?`<div class="row"><span class="muted">Coupon Discount</span><b class="green">- ${money(disc)}</b></div>`:""}<div class="row" style="border-top:1px solid #1e332b;padding-top:8px"><span>You Pay</span><b class="green">${money(Math.max(0,est-disc))}</b></div>`; box.dataset.final=Math.max(0,est-disc); }
async function placeOrder(){ let sel=document.getElementById("selSvc"), link=document.getElementById("link").value.trim(), q=Number(document.getElementById("qty").value), msg=document.getElementById("orderMsg"); let s=DB.services.find(x=>x.id===sel.value); if(!s){msg.textContent="Please select a service first.";return} if(!link.startsWith("http")){msg.textContent="Enter a valid link - must start with http / https.";return} if(!q||q<s.min||q>s.max){msg.textContent=`Quantity must be between ${s.min} and ${s.max}.`;return} calcPrice(); let final=Number(document.getElementById("priceBox").dataset.final||0); if(cur.balance<final){msg.textContent=`Balance is low. You need ${money(final)}, balance is ${money(cur.balance)}.`;return} let coup=document.getElementById("couponIn").value.trim().toUpperCase(); let c=DB.coupons.find(x=>x.code===coup&&x.active); DB.orders.unshift({id:uid(),userId:cur.id,username:cur.username,serviceId:s.id,serviceName:s.name,link,quantity:q,price:final,status:"Pending",couponCode:c?c.code:"",createdAt:new Date().toISOString()}); cur.balance-=final; await save(); await log(`User @${cur.username} placed order: ${s.name} (Qty ${q}, ${money(final)})`); if(cur.referredBy){ let r=DB.users.find(u=>u.id===cur.referredBy); if(r){ let bonus=Math.floor(final*DB.settings.referralBonus/100); if(bonus>0){ r.balance+=bonus; DB.transactions.unshift({id:uid(),userId:r.id,username:r.username,type:"Referral Bonus",title:`Referral bonus from @${cur.username}`,amount:bonus,status:"Paid",createdAt:new Date().toISOString()}); await notify(r.id,"Referral Bonus Earned",`You earned ${money(bonus)} referral bonus from @${cur.username}.`); } } } await save(); confetti(); toast("Order placed! Real-time sent live."); tab="orders"; render(); }
async function submitDeposit(){ let amt=Number(document.getElementById("depAmt").value), tid=document.getElementById("depTid").value.trim(), note=document.getElementById("depNote").value.trim(), msg=document.getElementById("depMsg"); if(!amt||amt<=0){msg.textContent="Enter a valid amount greater than 0.";return} if(amt<DB.settings.minDeposit){msg.textContent=`Minimum deposit is ${money(DB.settings.minDeposit)}.`;return} if(!tid){msg.textContent="Enter your Transaction ID (TID).";return} DB.deposits.unshift({id:uid(),userId:cur.id,username:cur.username,amount:amt,tid,note,status:"Pending",createdAt:new Date().toISOString()}); await save(); await log(`User @${cur.username} requested deposit: ${money(amt)} (TID ${tid})`); toast("Deposit request sent - Real-time!"); msg.textContent="Deposit submitted! Status: Pending."; document.getElementById("depAmt").value=""; document.getElementById("depTid").value=""; }
async function createTicket(){ let sub=document.getElementById("tSub").value.trim(), m=document.getElementById("tMsg").value.trim(), msg=document.getElementById("ticketMsg"); if(!sub||!m){msg.textContent="Enter subject and message.";return} DB.tickets.unshift({id:uid(),userId:cur.id,username:cur.username,email:cur.email,subject:sub,message:m,status:"Open",replies:[],createdAt:new Date().toISOString()}); await save(); await log(`User @${cur.username} opened ticket: ${sub}`); toast("Ticket created - sent live."); document.getElementById("tSub").value=""; document.getElementById("tMsg").value=""; render(); }

  body+=`<div class="card"><h3>🎁 My Referral</h3><p class="muted">Share your code. When someone signs up with your code, you will earn <b style="color:#fff">${DB.settings.referralBonus}%</b> bonus milega.</p><div class="flex mt"><input readonly value="${cur.referralCode}" class="input" style="margin:0;font-weight:800"><button class="btn2" onclick="copyText('${cur.referralCode}',this)">Copy Code</button></div><div class="flex mt"><div class="card" style="flex:1;text-align:center;margin:0"><p class="muted">MY REFERRALS</p><b>${refs.length}</b></div><div class="card" style="flex:1;text-align:center;margin:0"><p class="muted">TOTAL EARNINGS</p><b class="green">${money(refEarn)}</b></div></div>${refs.map(r=>`<div class="row card"><b>${esc(r.name)} (@${esc(r.username)})</b><span class="muted">Joined ${new Date(r.createdAt).toLocaleDateString()}</span></div>`).join("")}</div>`;
  body+=`<button class="card" style="width:100%;text-align:left;cursor:pointer" onclick="goTab('wallet')">🧾 <b>Wallet History</b></button><button class="card" style="width:100%;text-align:left;cursor:pointer" onclick="goTab('deposit')">₨ <b>Add Funds with Easypaisa</b><br><span class="muted">03493959558 — Mohammad Ajmal</span></button><button class="btn" style="background:#2a1013;color:#ff8a94;margin-top:14px" onclick="logout()">Logout</button>`;
 }
 return header+body+`</div><nav class="nav"><div class="navin">${[["home","🏠","Home"],["deposit","₨","Deposit"],["new","＋","New"],["orders","📋","Orders"],["favorites","⭐","Saved"],["support","🛟","Support"],["profile","👤","Profile"]].map(x=>`<button class="${tab===x[0]?"on":""}" onclick="goTab('${x[0]}')">${x[1]}<span>${x[2]}</span></button>`).join("")}</div></nav>`;
}
