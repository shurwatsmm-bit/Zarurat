<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZARORAT - Admin PRO | Real-time</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#040a08;color:#eafff5;font-family:'Plus Jakarta Sans',system-ui;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(700px 350px at 15% -5%,rgba(0,230,118,.28),transparent 60%),radial-gradient(700px 350px at 90% 0%,rgba(0,194,168,.22),transparent 60%),radial-gradient(600px 400px at 50% 110%,rgba(45,212,255,.14),transparent 60%)}
.orb{position:fixed;border-radius:50%;filter:blur(50px);opacity:.45;z-index:0;pointer-events:none;animation:float 9s ease-in-out infinite}
.orb1{width:220px;height:220px;background:#00e676;top:-40px;left:-60px}.orb2{width:180px;height:180px;background:#2dd4ff;top:30%;right:-70px;animation-delay:-3s}.orb3{width:160px;height:160px;background:#c8ff3d;bottom:-40px;left:35%;animation-delay:-6s}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-28px) scale(1.12)}}
@keyframes pop{0%{opacity:0;transform:translateY(22px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(0,230,118,.5)}50%{box-shadow:0 0 0 7px rgba(0,230,118,0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(0,230,118,0)}50%{box-shadow:0 0 32px rgba(0,230,118,.45)}}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(320px) rotate(720deg);opacity:0}}
.anim{animation:pop .55s cubic-bezier(.2,.9,.3,1.2) both}.anim2{animation:pop .55s .08s cubic-bezier(.2,.9,.3,1.2) both}.anim3{animation:pop .55s .16s cubic-bezier(.2,.9,.3,1.2) both}
.live{width:9px;height:9px;border-radius:50%;background:#00e676;display:inline-block;animation:pulseDot 1.6s infinite}
.shimmer{background:linear-gradient(100deg,#00e676,#7dffb8,#2dd4ff,#00e676);background-size:200% 100%;animation:shimmer 2.8s linear infinite;-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{max-width:460px;margin:auto;padding:14px 16px 120px;position:relative;z-index:1}.wrap-wide{max-width:1180px;margin:auto;padding:14px 16px 60px;position:relative;z-index:1}
.logo{display:flex;gap:10px;align-items:center}.z{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#00e676,#00c2a8,#2dd4ff);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:21px;color:#03110a;animation:glow 2.5s infinite;transition:.3s}.z:hover{transform:rotate(-8deg) scale(1.08)}
.chip{border:1px solid #1e332b;background:#0a1511;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);border-radius:22px;padding:18px;transition:.3s}.glass:hover{transform:translateY(-2px);border-color:rgba(0,230,118,.4)}
.card{background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:16px;margin-top:12px;transition:.3s;animation:pop .45s both}.card:hover{transform:translateY(-2px);border-color:rgba(0,230,118,.35)}
.input{width:100%;background:#08110e;border:1px solid #1e332b;color:#eafff5;border-radius:14px;padding:14px;font-size:15px;outline:none;margin-top:6px;transition:.25s}.input:focus{border-color:#00e676;box-shadow:0 0 0 3px rgba(0,230,118,.18);transform:scale(1.01)}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9db5ab}
.btn{width:100%;background:linear-gradient(100deg,#00e676,#00c2a8,#2dd4ff);color:#03110a;border:none;border-radius:14px;padding:15px;font-weight:800;font-size:15px;cursor:pointer;transition:.25s;position:relative;overflow:hidden}.btn:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 12px 30px rgba(0,230,118,.35)}.btn:active{transform:scale(.97)}
.btn2{background:#0e1a14;border:1px solid #1e332b;color:#eafff5;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;transition:.25s}.btn2:hover{border-color:#00e676;background:#12241c}
.muted{color:#9db5ab;font-size:13px}.green{color:#00e676}.big{font-family:'Space Grotesk';font-size:28px;font-weight:700}
.hidden{display:none!important}.flex{display:flex;gap:8px}.mt{margin-top:14px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#08110e;border:1px solid #1e332b;border-radius:12px;padding:4px}.tabs button{border:none;padding:11px;border-radius:9px;font-weight:700;cursor:pointer;background:transparent;color:#9db5ab}.tabs button.on{background:linear-gradient(100deg,#00e676,#00c2a8);color:#03110a;animation:pop .3s}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}.mini{background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px;text-align:center;transition:.3s}.mini:hover{transform:translateY(-3px) scale(1.02)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat>div{background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:16px;transition:.3s}.stat>div:hover{transform:translateY(-3px)}
.sticky{position:sticky;top:0;z-index:20;background:rgba(5,11,9,.92);backdrop-filter:blur(12px);border-bottom:1px solid #1e332b;margin:-14px -16px 0;padding:12px 16px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#070f0c;border-top:1px solid #1e332b;padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:30}.navin{max-width:460px;margin:auto;display:grid;grid-template-columns:repeat(7,1fr)}.nav button{background:none;border:none;color:#9db5ab;font-size:10px;font-weight:700;display:flex;flex-direction:column;gap:3px;align-items:center;cursor:pointer;transition:.25s}.nav button.on{color:#00e676;transform:translateY(-3px) scale(1.1)}
.bar{height:8px;background:#08110e;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#00e676,#2dd4ff);transition:width .8s}
.pill{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800}.ok{background:#0f2a1e;color:#7dffb8;border:1px solid #1f4a35}.warn{background:#2a230f;color:#ffd88a;border:1px solid #4a3a1a}.bad{background:#2a1013;color:#ff8a94;border:1px solid #4a1a20}
.admin-nav{display:flex;gap:8px;overflow:auto;padding-bottom:4px;scrollbar-width:none}.admin-nav button{white-space:nowrap}
.sync{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#0f2a1e;border:1px solid #1f4a35;color:#7dffb8;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;z-index:99;animation:slideIn .4s}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#eafff5;color:#03110a;padding:12px 18px;border-radius:14px;font-weight:800;z-index:99;box-shadow:0 15px 40px rgba(0,0,0,.5);animation:pop .35s}
.easypaisa{background:linear-gradient(135deg,#7dffb8,#00e676,#00c2a8);color:#03110a;border-radius:26px;padding:18px;margin-top:14px;animation:glow 3s infinite}
.hero h1{font-family:'Space Grotesk';font-size:clamp(38px,11vw,62px);line-height:.95;margin:18px 0 12px}
</style></head><body>
<div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div><div id="app"></div>
<script>
// ===== REALTIME DATABASE - ZARORA =====
// Database: zarora-f7526  |  URL neeche hai. Agar Firebase Rules me Auth chahiye to apni apiKey yahan daal do,
// warna public-read/write rules par REST bina key ke bhi sync karega. Dono files isi ek URL se sync hoti hain.
const DB_URL = "https://zarora-f7526-default-rtdb.firebaseio.com/zarorat.json";
const FIREBASE_CONFIG = { apiKey:"PASTE_YOUR_API_KEY_HERE_IF_NEEDED", authDomain:"zarora-f7526.firebaseapp.com", databaseURL:"https://zarora-f7526-default-rtdb.firebaseio.com", projectId:"zarora-f7526" };
let DB=null, _saving=false, _lastJSON="", _syncTimer=null;
const EMPTY_DB = ()=>({users:[],services:[],orders:[],deposits:[],tickets:[],notifications:[],coupons:[],announcements:[],categories:[],activity:[],settings:{panelName:"ZARORAT",minDeposit:50,referralBonus:5,supportMessage:"Ask the admin anything. Replies appear inside your ticket."},favorites:[],transactions:[]});
async function loadDB(){ try{ const r=await fetch(DB_URL); const j=await r.json(); DB=j||EMPTY_DB(); for(const k in EMPTY_DB()) if(!DB[k]) DB[k]=EMPTY_DB()[k]; }catch(e){ DB=JSON.parse(localStorage.getItem("zarorat_backup")||"null")||EMPTY_DB(); } _lastJSON=JSON.stringify(DB); return DB; }
async function saveDB(){ localStorage.setItem("zarorat_backup",JSON.stringify(DB)); const j=JSON.stringify(DB); if(j===_lastJSON) return; _lastJSON=j; _saving=true; try{ await fetch(DB_URL,{method:"PUT",headers:{"Content-Type":"application/json"},body:j}); }catch(e){} _saving=false; showSync(); }
function showSync(){ let el=document.getElementById("syncBadge"); if(!el){ el=document.createElement("div"); el.id="syncBadge"; el.className="sync"; el.innerHTML="<span class='live'></span> &nbsp;Synced • Real-time"; document.body.appendChild(el);} el.style.display="block"; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display="none",1800); }
function startPolling(){ clearInterval(_syncTimer); _syncTimer=setInterval(async()=>{ if(_saving) return; try{ const r=await fetch(DB_URL+"?t="+Date.now()); const j=await r.json(); if(!j) return; const nj=JSON.stringify(j); if(nj!==_lastJSON){ DB=j; _lastJSON=nj; localStorage.setItem("zarorat_backup",nj); onRemoteChange&&onRemoteChange(); showSync(); } }catch(e){} },2500); }
let onRemoteChange=null;
function toast(msg){ let t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function confetti(){ for(let i=0;i<28;i++){ let c=document.createElement("div"); c.style.cssText=`position:fixed;top:-10px;left:${Math.random()*100}vw;width:8px;height:12px;background:${["#00e676","#2dd4ff","#c8ff3d","#fff"][i%4]};z-index:200;border-radius:2px;animation:confetti ${1+Math.random()}s ease-in forwards`; document.body.appendChild(c); setTimeout(()=>c.remove(),2200);} }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36); }
function esc(s){ return String(s||"").replace(/</g,"&lt;"); }
function money(n){ return "Rs "+(n||0); }
async function log(t){ DB.activity.unshift({text:t,createdAt:new Date().toISOString()}); await saveDB(); }
async function notify(u2,t,m){ DB.notifications.unshift({id:uid(),userId:u2,title:t,message:m,readBy:[],createdAt:new Date().toISOString()}); await saveDB(); }

const KEY="ZARORAT-ADM-2026";
let adminTab="dashboard", authed=localStorage.getItem("zarorat_admin")==="1";
async function save(){ await saveDB(); }
function render(){ document.getElementById("app").innerHTML = !authed ? loginHTML() : adminHTML(); window.scrollTo(0,0); }
function loginHTML(){ return `<div class="wrap" style="max-width:440px"><div class="anim" style="text-align:center;margin-top:60px"><div class="z" style="margin:auto;width:64px;height:64px;font-size:32px">Z</div><h1 style="font-family:'Space Grotesk';font-size:36px;margin:14px 0 6px">ZARORAT <span class="shimmer">ADMIN PRO</span></h1><p class="muted">Real-time Control Panel • Same Firebase Database</p></div>
<div class="glass anim2" style="margin-top:22px"><label class="label">Admin Key</label><input id="admKey" type="password" class="input" placeholder="Admin key"><p id="admErr" class="muted"></p><button class="btn" style="margin-top:12px" onclick="openAdmin()">Open Admin Panel →</button><p class="muted" style="text-align:center">Key: ZARORAT-ADM-2026</p></div>
<div class="card anim3" style="text-align:center"><span class="live"></span> <b>Live Sync</b><p class="muted">User wali index.html se jo order / deposit / ticket aayega, yahan 2-3 sec me dikhega. Yahan se approve karoge to user ke paas live jayega.</p><a href="index.html" style="color:#00e676;font-weight:800">← Back to User Panel (index.html)</a></div></div>`; }
function openAdmin(){ let v=document.getElementById("admKey").value; if(v.trim()===KEY){ authed=true; localStorage.setItem("zarorat_admin","1"); render(); confetti(); toast("Welcome Admin - Real-time Connected"); } else document.getElementById("admErr").textContent="Admin key is incorrect."; }
function logoutAdmin(){ authed=false; localStorage.removeItem("zarorat_admin"); render(); }
function adminHTML(){
 let pending=DB.orders.filter(o=>o.status==="Pending").length, pendDep=DB.deposits.filter(d=>d.status==="Pending").length, openT=DB.tickets.filter(t=>t.status==="Open"||t.status==="Replied").length;
 let rev=DB.orders.filter(o=>o.status==="Completed").reduce((s,o)=>s+o.price,0);
 let tabs=[["dashboard","Analytics"],["services","Services"],["categories","Categories"],["orders",`Orders (${pending})`],["deposits",`Deposits (${pendDep})`],["users","Users"],["tickets",`Tickets (${openT})`],["notifications","Notifications"],["coupons","Coupons"],["announcements","Announcements"],["activity","Activity Log"],["settings","Settings"]];
 let h=`<div class="wrap-wide"><div class="sticky"><div class="row"><div class="logo"><div class="z">Z</div><div><b style="font-family:'Space Grotesk'">${DB.settings.panelName} <span class="green">ADMIN PRO</span></b><div class="muted">Control Panel - <span class="live"></span> Live - Synced • Real-time</div></div></div><div class="flex"><a href="index.html" class="btn2" style="text-decoration:none;padding:10px 14px">User Panel</a><button class="btn2" onclick="logoutAdmin()">Logout</button></div></div><div class="admin-nav mt">${tabs.map(t=>`<button class="btn2" style="${adminTab===t[0]?'background:linear-gradient(100deg,#00e676,#00c2a8);color:#03110a':''}" onclick="adminTab='${t[0]}';render()">${t[1]}</button>`).join("")}</div></div>`;
 let b="";
 if(adminTab==="dashboard"){ b+=`<h2 class="anim" style="font-family:'Space Grotesk';font-size:28px">Analytics Dashboard</h2><p class="muted">Live totals from Firebase - nothing is fake.</p><div class="stat mt"><div class="anim"><p class="muted">TOTAL REVENUE</p><p class="big">${money(rev)}</p></div><div class="anim2"><p class="muted">TOTAL USERS</p><p class="big">${DB.users.length}</p></div><div class="anim2"><p class="muted">TOTAL ORDERS</p><p class="big">${DB.orders.length}</p><p class="muted">${pending} pending</p></div><div class="anim3"><p class="muted">PENDING DEPOSITS</p><p class="big" style="color:#ffd88a">${pendDep}</p></div><div class="anim"><p class="muted">OPEN TICKETS</p><p class="big" style="color:#7dc8ff">${openT}</p></div><div class="anim2"><p class="muted">SERVICES</p><p class="big">${DB.services.length}</p></div></div>`; b+=`<div class="card"><h3>Quick Actions</h3><div class="flex"><button class="btn2" onclick="adminTab='orders';render()">Review Orders →</button><button class="btn2" onclick="adminTab='tickets';render()">Reply to Tickets →</button><button class="btn2" onclick="adminTab='notifications';render()">Send Notification →</button></div></div>`; b+=`<div class="card"><h3>Recent Activity - Live</h3>${DB.activity.slice(0,12).map(a=>`<p class="muted">${esc(a.text)} - ${new Date(a.createdAt).toLocaleString()}</p>`).join("")||"<p class='muted'>No activity yet.</p>"}</div>`; }
 if(adminTab==="services"){ b+=`<div style="display:grid;grid-template-columns:380px 1fr;gap:16px"><div class="card"><h3>Add Service - Live to Users</h3><label class="label">Service Name</label><input id="sName" class="input" placeholder="e.g. Instagram Followers"><label class="label">Category</label><select id="sCat" class="input">${["Instagram","TikTok","YouTube","Facebook","Design","Website","Other",...DB.categories.map(c=>c.name)].map(c=>`<option>${c}</option>`).join("")}</select><div class="flex"><div style="flex:1"><label class="label">Price / 1000</label><input id="sPrice" type="number" class="input"></div><div style="flex:1"><label class="label">Min</label><input id="sMin" type="number" class="input" value="100"></div><div style="flex:1"><label class="label">Max</label><input id="sMax" type="number" class="input" value="10000"></div></div><label class="label">Description</label><textarea id="sDesc" class="input" rows="3" placeholder="Delivery time, quality, notes..."></textarea><button class="btn" style="margin-top:10px" onclick="addService()">+ Add Service</button></div><div><h3>Services List (${DB.services.length})</h3>${DB.services.length?DB.services.map(s=>`<div class="card"><div class="row"><div><b>${esc(s.name)}</b><p class="muted">${esc(s.category)} - Min ${s.min} - Max ${s.max}</p><p class="muted">${esc(s.description||"No description.")}</p></div><div style="text-align:right"><b class="green">${money(s.pricePer1000)} / 1k</b><br><button class="btn2" style="color:#ff8a94;margin-top:8px" onclick="delService('${s.id}')">Delete</button></div></div></div>`).join(""):`<div class="card" style="text-align:center">No services yet</div>`}</div></div>`; }
 if(adminTab==="categories"){ b+=`<div class="card"><h3>Add Category</h3><div class="flex"><input id="catName" class="input" style="margin:0" placeholder="e.g. Design"><button class="btn" style="width:auto" onclick="addCat()">+ Add</button></div></div><h3 class="mt">Categories</h3>${DB.categories.map(c=>`<div class="card"><div class="row"><b>${esc(c.name)}</b><button class="btn2" onclick="delCat('${c.id}')">Delete</button></div></div>`).join("")||"<p class='muted'>No custom categories.</p>"}`; }
 if(adminTab==="orders"){ b+=`<h3>Orders - Live from Users</h3>${DB.orders.length?DB.orders.map(o=>`<div class="card"><div class="row"><div><b>${esc(o.serviceName)}</b><p class="muted">@${esc(o.username)} - Qty ${o.quantity} - ${money(o.price)}</p><a href="${esc(o.link)}" target="_blank" style="color:#7dc8ff;word-break:break-all">${esc(o.link)}</a></div><span class="pill ${o.status==="Completed"?"ok":o.status==="Cancelled"?"bad":"warn"}">${o.status}</span></div><div class="flex mt"><button class="btn2" onclick="setOrder('${o.id}','Pending')">Pending</button><button class="btn2" onclick="setOrder('${o.id}','Completed')">Completed</button><button class="btn2" onclick="setOrder('${o.id}','Cancelled')">Cancelled</button><button class="btn2" onclick="refundOrder('${o.id}')">Refund</button></div></div>`).join(""):`<div class="card" style="text-align:center">No orders yet - user se order aate hi yahan live dikhega.</div>`}`; }
 if(adminTab==="deposits"){ b+=`<h3>Deposit Requests - Live</h3><p class="muted">Easypaisa payment check karo. Approve karte hi user balance live badhega.</p>${DB.deposits.length?DB.deposits.map(d=>`<div class="card"><div class="row"><div><b style="font-family:'Space Grotesk';font-size:24px">${money(d.amount)}</b><p>@${esc(d.username)} - ${new Date(d.createdAt).toLocaleString()}</p><p>TID: <b>${esc(d.tid)}</b></p><p class="muted">${esc(d.note||"")}</p></div><span class="pill ${d.status==="Approved"?"ok":d.status==="Rejected"?"bad":"warn"}">${d.status}</span></div>${d.status==="Pending"?`<div class="flex mt"><button class="btn" style="width:auto" onclick="approveDep('${d.id}')">Approve & Add Balance</button><button class="btn2" onclick="rejectDep('${d.id}')">Reject</button></div>`:""}</div>`).join(""):`<div class="card" style="text-align:center">No deposit requests yet</div>`}`; }
 if(adminTab==="users"){ b+=`<div style="display:grid;grid-template-columns:380px 1fr;gap:16px"><div class="card"><h3>Edit Balance - Live</h3><label class="label">Select User</label><select id="balUser" class="input">${DB.users.map(u=>`<option value="${u.id}">${esc(u.name)} (@${esc(u.username)}) - ${money(u.balance)}</option>`).join("")}</select><label class="label">Amount (Rs)</label><input id="balAmt" type="number" class="input" placeholder="e.g. 500"><div class="flex mt"><button class="btn" onclick="addBal('add')">Add Balance</button><button class="btn2" onclick="addBal('remove')">Remove</button></div></div><div><h3>Users (${DB.users.length})</h3>${DB.users.map(u=>`<div class="card"><div class="row"><div><b>${esc(u.name)}</b><p class="muted">@${esc(u.username)} - ${esc(u.email||"")} - Referral: ${u.referralCode}</p><p class="muted">Joined ${new Date(u.createdAt).toLocaleDateString()} - ${DB.orders.filter(o=>o.userId===u.id).length} orders</p></div><div style="text-align:right"><b>${money(u.balance)}</b><br><span class="pill ${u.status==="Blocked"?"bad":"ok"}">${u.status||"Active"}</span></div></div><div class="flex mt"><button class="btn2" onclick="toggleBlock('${u.id}')">${u.status==="Blocked"?"Unblock":"Block"} User</button><button class="btn2" style="color:#ff8a94" onclick="delUser('${u.id}')">Delete User</button></div></div>`).join("")||"<p class='muted'>No users yet</p>"}</div></div>`; }
 if(adminTab==="tickets"){ b+=`<h3>Support Tickets (${DB.tickets.length}) - Live</h3>${DB.tickets.map(t=>`<div class="card"><div class="row"><div><b>${esc(t.subject)}</b><p class="muted">@${esc(t.username)} - ${esc(t.email)} - ${new Date(t.createdAt).toLocaleString()}</p><p>${esc(t.message)}</p></div><span class="pill warn">${t.status}</span></div>${(t.replies||[]).map(r=>`<div class="card" style="background:#08110e"><b>${r.sender==="admin"?"ADMIN":"@"+esc(t.username)}</b><p>${esc(r.text)}</p></div>`).join("")}<div class="flex mt"><input id="areply-${t.id}" class="input" style="margin:0" placeholder="Write your reply..."><button class="btn2" onclick="adminReply('${t.id}')">Send</button><button class="btn2" onclick="closeTicket('${t.id}')">Close</button></div></div>`).join("")||"<div class='card'>No tickets here</div>"}`; }
 if(adminTab==="notifications"){ b+=`<div style="display:grid;grid-template-columns:380px 1fr;gap:16px"><div class="card"><h3>Send Notification - Live to Users</h3><label class="label">Send To</label><select id="nTarget" class="input"><option value="all">All Users</option>${DB.users.map(u=>`<option value="${u.id}">${esc(u.name)} (@${esc(u.username)})</option>`).join("")}</select><label class="label">Title</label><input id="nTitle" class="input" placeholder="e.g. New Service Added"><label class="label">Message</label><textarea id="nMsg" class="input" rows="4"></textarea><button class="btn" style="margin-top:10px" onclick="sendNotif()">Send Notification</button></div><div><h3>Sent Notifications (${DB.notifications.length})</h3>${DB.notifications.map(n=>`<div class="card"><b>${esc(n.title)}</b><p class="muted">${esc(n.message)}</p><p class="muted">${new Date(n.createdAt).toLocaleString()} - Read by ${(n.readBy||[]).length}</p></div>`).join("")||"<p class='muted'>No notifications yet</p>"}</div></div>`; }
 if(adminTab==="coupons"){ b+=`<div class="card"><h3>Create Coupon</h3><label class="label">Coupon Code</label><input id="cCode" class="input" placeholder="e.g. SAVE10"><label class="label">Discount %</label><input id="cDisc" type="number" class="input" value="10"><button class="btn" style="margin-top:10px" onclick="addCoupon()">Create Coupon</button></div>${DB.coupons.map(c=>`<div class="card"><div class="row"><div><b>${c.code}</b><p class="muted">${c.discountPercent}% off</p></div><div class="flex"><button class="btn2" onclick="toggleCoupon('${c.id}')">${c.active?"Disable":"Enable"}</button><button class="btn2" onclick="delCoupon('${c.id}')">Delete</button></div></div></div>`).join("")}`; }
 if(adminTab==="announcements"){ b+=`<div class="card"><h3>Create Announcement - Live to Users</h3><label class="label">Title</label><input id="aTitle" class="input"><label class="label">Message</label><textarea id="aMsg" class="input" rows="3"></textarea><button class="btn" style="margin-top:10px" onclick="addAnn()">Create Announcement</button></div>${DB.announcements.map(a=>`<div class="card"><div class="row"><div><b>${esc(a.title)}</b><p class="muted">${esc(a.message)}</p></div><div class="flex"><button class="btn2" onclick="toggleAnn('${a.id}')">${a.enabled?"Disable":"Enable"}</button><button class="btn2" onclick="delAnn('${a.id}')">Delete</button></div></div></div>`).join("")}`; }
 if(adminTab==="activity"){ b+=`<h3>Activity Log - Live</h3>${DB.activity.slice(0,50).map(a=>`<div class="card"><div class="row"><p>${esc(a.text)}</p><span class="muted">${new Date(a.createdAt).toLocaleString()}</span></div></div>`).join("")||"<p class='muted'>No activity yet</p>"}`; }
 if(adminTab==="settings"){ b+=`<div class="card" style="max-width:640px"><h3>Panel Settings - Live to Users</h3><label class="label">Panel Name</label><input id="setName" class="input" value="${esc(DB.settings.panelName)}"><label class="label">Minimum Deposit (Rs)</label><input id="setMin" type="number" class="input" value="${DB.settings.minDeposit}"><label class="label">Referral Bonus (%)</label><input id="setBonus" type="number" class="input" value="${DB.settings.referralBonus}"><label class="label">Support Message</label><textarea id="setSup" class="input" rows="3">${esc(DB.settings.supportMessage)}</textarea><button class="btn" style="margin-top:10px" onclick="saveSettings()">Save Settings</button></div>`; }
 return h+b+`</div>`;
}
async function addService(){ let n=document.getElementById("sName").value.trim(), p=Number(document.getElementById("sPrice").value), mn=Number(document.getElementById("sMin").value), mx=Number(document.getElementById("sMax").value), cat=document.getElementById("sCat").value, d=document.getElementById("sDesc").value.trim(); if(!n||!p){alert("Service name, price required");return} DB.services.unshift({id:uid(),name:n,category:cat,pricePer1000:p,min:mn,max:mx,description:d,createdAt:new Date().toISOString()}); await save(); await log(`Admin added service: ${n} (${cat})`); confetti(); toast("Service live ho gayi - users ko dikhegi!"); render(); }
async function delService(id){ DB.services=DB.services.filter(s=>s.id!==id); await save(); render(); }
async function addCat(){ let n=document.getElementById("catName").value.trim(); if(!n) return; DB.categories.unshift({id:uid(),name:n,createdAt:new Date().toISOString()}); await save(); render(); }
async function delCat(id){ DB.categories=DB.categories.filter(c=>c.id!==id); await save(); render(); }
async function setOrder(id,st){ let o=DB.orders.find(x=>x.id===id); o.status=st; await save(); await notify(o.userId,`Order ${st}`,`Your order "${o.serviceName}" (Qty ${o.quantity}) is now ${st}.`); await log(`Admin marked order as ${st}: ${o.serviceName} for @${o.username}`); toast("Order "+st+" - user ko live gaya"); render(); }
async function refundOrder(id){ let o=DB.orders.find(x=>x.id===id); let u=DB.users.find(x=>x.id===o.userId); if(!u) return; u.balance+=o.price; o.status="Refunded"; await save(); await notify(o.userId,"Order Refunded",`Your order "${o.serviceName}" was refunded. ${money(o.price)} has been returned.`); render(); }
async function approveDep(id){ let d=DB.deposits.find(x=>x.id===id); let u=DB.users.find(x=>x.id===d.userId); if(!u) return; u.balance+=d.amount; d.status="Approved"; await save(); await notify(d.userId,"Deposit Approved",`Your deposit of ${money(d.amount)} was approved.`); await log(`Admin approved deposit: ${money(d.amount)} for @${u.username}`); confetti(); toast("Deposit approved - balance live badh gaya"); render(); }
async function rejectDep(id){ let d=DB.deposits.find(x=>x.id===id); d.status="Rejected"; await save(); await notify(d.userId,"Deposit Rejected",`Your deposit of ${money(d.amount)} was rejected.`); render(); }
async function addBal(mode){ let uid2=document.getElementById("balUser").value, amt=Number(document.getElementById("balAmt").value); let u=DB.users.find(x=>x.id===uid2); if(!u||!amt) return; if(mode==="add"){ u.balance+=amt; DB.transactions.unshift({id:uid(),userId:u.id,username:u.username,type:"Balance Adjustment",title:"Balance added by admin",amount:amt,status:"Completed",createdAt:new Date().toISOString()}); await notify(u.id,"Balance Added",`${money(amt)} was added to your balance by admin.`); } else { u.balance=Math.max(0,u.balance-amt); DB.transactions.unshift({id:uid(),userId:u.id,username:u.username,type:"Balance Adjustment",title:"Balance removed by admin",amount:-amt,status:"Completed",createdAt:new Date().toISOString()}); await notify(u.id,"Balance Removed",`${money(amt)} was removed from your balance by admin.`); } await save(); toast("Balance live update ho gaya"); render(); }
async function toggleBlock(id){ let u=DB.users.find(x=>x.id===id); u.status=u.status==="Blocked"?"Active":"Blocked"; await save(); render(); }
async function delUser(id){ if(!confirm("Delete this user?")) return; DB.users=DB.users.filter(u=>u.id!==id); await save(); render(); }
async function adminReply(id){ let v=document.getElementById("areply-"+id).value.trim(); if(!v) return; let t=DB.tickets.find(x=>x.id===id); t.replies.push({sender:"admin",text:v,at:new Date().toISOString()}); t.status="Replied"; await save(); await notify(t.userId,"Ticket Reply",`Admin replied to your ticket "${t.subject}".`); toast("Reply live chala gaya"); render(); }
async function closeTicket(id){ let t=DB.tickets.find(x=>x.id===id); t.status="Closed"; await save(); render(); }
async function sendNotif(){ let target=document.getElementById("nTarget").value, title=document.getElementById("nTitle").value.trim(), msg=document.getElementById("nMsg").value.trim(); if(!title||!msg) return; await notify(target,title,msg); toast("Notification live bheji gayi"); render(); }
async function addCoupon(){ let code=document.getElementById("cCode").value.trim().toUpperCase(), disc=Number(document.getElementById("cDisc").value); if(!code||!disc) return; DB.coupons.unshift({id:uid(),code,discountPercent:disc,active:true,createdAt:new Date().toISOString()}); await save(); render(); }
async function toggleCoupon(id){ let c=DB.coupons.find(x=>x.id===id); c.active=!c.active; await save(); render(); }
async function delCoupon(id){ DB.coupons=DB.coupons.filter(c=>c.id!==id); await save(); render(); }
async function addAnn(){ let t=document.getElementById("aTitle").value.trim(), m=document.getElementById("aMsg").value.trim(); if(!t||!m) return; DB.announcements.unshift({id:uid(),title:t,message:m,enabled:true,createdAt:new Date().toISOString()}); await save(); render(); }
async function toggleAnn(id){ let a=DB.announcements.find(x=>x.id===id); a.enabled=!a.enabled; await save(); render(); }
async function delAnn(id){ DB.announcements=DB.announcements.filter(a=>a.id!==id); await save(); render(); }
async function saveSettings(){ DB.settings={panelName:document.getElementById("setName").value.trim()||"ZARORAT",minDeposit:Number(document.getElementById("setMin").value)||50,referralBonus:Number(document.getElementById("setBonus").value)||5,supportMessage:document.getElementById("setSup").value.trim()}; await save(); toast("Settings live save ho gayi"); render(); }
onRemoteChange=()=>{ render(); };
(async()=>{ await loadDB(); render(); startPolling(); })();
</script></body></html>
